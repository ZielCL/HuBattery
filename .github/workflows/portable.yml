name: Compilar versión portátil

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        shell: cmd
        run: build.cmd
      - name: Probar protocolos de batería
        shell: cmd
        run: test.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: HuBattery-Windows
          path: dist/HuBattery.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HuBattery-Windows
      - name: Publicar ejecutable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Item HuBattery.exe).VersionInfo.ProductVersion
          if ("v$version" -cne $env:GITHUB_REF_NAME) {
            throw "La versión del ejecutable ($version) no coincide con $env:GITHUB_REF_NAME."
          }
          $options = @()
          if ($env:GITHUB_REF_NAME -match '-') { $options += '--prerelease' }
          gh release create "$env:GITHUB_REF_NAME" HuBattery.exe --verify-tag --repo "$env:GITHUB_REPOSITORY" --title "$env:GITHUB_REF_NAME" --generate-notes @options
